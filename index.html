<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TW2 Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-4xl px-4 py-8">
      <header class="mb-6">
        <h1 class="text-2xl font-bold">TW2 Tools</h1>
        <p id="data-status" class="mt-2 text-sm text-slate-700">Loading data...</p>
      </header>

      <div class="mb-4 flex gap-2">
        <button
          id="tab-building"
          data-tab="building"
          type="button"
          class="rounded border border-slate-300 bg-white px-4 py-2 text-sm font-medium"
        >
          Building Calculator
        </button>
        <button
          id="tab-crowns"
          data-tab="crowns"
          type="button"
          class="rounded border border-slate-300 bg-white px-4 py-2 text-sm font-medium"
        >
          Crown Calculator
        </button>
        <button
          id="tab-wallbreaker"
          data-tab="wallbreaker"
          type="button"
          class="rounded border border-slate-300 bg-white px-4 py-2 text-sm font-medium"
        >
          Wallbreaker Calculator
        </button>
      </div>

      <section id="view-building" class="rounded border border-slate-300 bg-white p-4">
        <h2 class="mb-4 text-lg font-semibold">Building Calculator</h2>

        <div class="grid gap-4 md:grid-cols-3">
          <label class="text-sm">
            <span class="mb-1 block font-medium">Building</span>
            <select id="building-select" class="w-full rounded border border-slate-300 px-3 py-2"></select>
          </label>

          <label class="text-sm">
            <span class="mb-1 block font-medium">Current Level</span>
            <input
              id="current-level"
              type="number"
              min="1"
              value="1"
              class="w-full rounded border border-slate-300 px-3 py-2"
            />
          </label>

          <label class="text-sm">
            <span class="mb-1 block font-medium">Target Level</span>
            <input
              id="target-level"
              type="number"
              min="1"
              value="1"
              class="w-full rounded border border-slate-300 px-3 py-2"
            />
          </label>
        </div>

        <p id="building-range" class="mt-3 text-sm text-slate-600"></p>
        <p id="building-error" class="mt-1 text-sm text-red-700"></p>

        <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Wood</p>
            <p id="result-wood" class="text-lg font-semibold">0</p>
          </div>
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Clay</p>
            <p id="result-clay" class="text-lg font-semibold">0</p>
          </div>
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Iron</p>
            <p id="result-iron" class="text-lg font-semibold">0</p>
          </div>
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Provisions</p>
            <p id="result-food" class="text-lg font-semibold">0</p>
          </div>
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Build Time</p>
            <p id="result-time" class="text-lg font-semibold">00:00:00:00</p>
          </div>
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Crown Cost</p>
            <p id="result-building-crowns" class="text-lg font-semibold">0</p>
          </div>
        </div>
      </section>

      <section id="view-crowns" class="hidden rounded border border-slate-300 bg-white p-4">
        <h2 class="mb-4 text-lg font-semibold">Crown Cost Calculator (Instant Finish)</h2>

        <div class="grid gap-4 md:grid-cols-5">
          <label class="text-sm">
            <span class="mb-1 block font-medium">Days</span>
            <input id="duration-days" type="number" min="0" value="0" class="w-full rounded border border-slate-300 px-3 py-2" />
          </label>

          <label class="text-sm">
            <span class="mb-1 block font-medium">Hours</span>
            <input id="duration-hours" type="number" min="0" value="0" class="w-full rounded border border-slate-300 px-3 py-2" />
          </label>

          <label class="text-sm">
            <span class="mb-1 block font-medium">Minutes</span>
            <input id="duration-minutes" type="number" min="0" value="0" class="w-full rounded border border-slate-300 px-3 py-2" />
          </label>

          <label class="text-sm">
            <span class="mb-1 block font-medium">Seconds</span>
            <input id="duration-seconds" type="number" min="0" value="0" class="w-full rounded border border-slate-300 px-3 py-2" />
          </label>
        </div>

        <div class="mt-4 grid gap-4 md:grid-cols-3">
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Total Duration (seconds)</p>
            <p id="duration-total-seconds" class="text-lg font-semibold">0</p>
          </div>

          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Crown Cost</p>
            <p id="result-crowns" class="text-lg font-semibold">0</p>
          </div>
        </div>
      </section>

      <section id="view-wallbreaker" class="hidden rounded border border-slate-300 bg-white p-4">
        <h2 class="mb-4 text-lg font-semibold">Wallbreaker Calculator</h2>

        <div class="grid gap-4 md:grid-cols-2">
          <label class="text-sm">
            <span class="mb-1 block font-medium">Provisions</span>
            <input id="wb-provisions" type="number" min="0" value="0" class="w-full rounded border border-slate-300 px-3 py-2" />
          </label>

          <label class="text-sm">
            <span class="mb-1 block font-medium">Trebuchets</span>
            <input id="wb-trebuchets" type="number" min="0" value="0" class="w-full rounded border border-slate-300 px-3 py-2" />
          </label>
        </div>

        <p id="wb-error" class="mt-1 text-sm text-red-700"></p>

        <div class="mt-4 grid gap-3 sm:grid-cols-2">
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Rams</p>
            <p id="wb-result-rams" class="text-lg font-semibold">0</p>
          </div>
          <div class="rounded border border-slate-200 bg-slate-50 p-3">
            <p class="text-xs text-slate-500">Escort Provisions</p>
            <p id="wb-result-escort" class="text-lg font-semibold">0</p>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
